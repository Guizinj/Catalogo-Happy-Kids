<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Listas - Loja de Brinquedos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="tela-login" class="container-centralizado">
        <div class="card-login">
            <h2>Acesso Restrito</h2>
            <p>Faça login para gerenciar as listas de presentes.</p>
            <form id="form-login">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="vendedora@loja.com" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="******" required>
                </div>
                <button type="submit" class="btn-primario">Entrar</button>
                <p id="erro-login" class="texto-erro"></p>
            </form>
        </div>
    </div>

    <!-- TELA PRINCIPAL DA APLICAÇÃO -->
    <div id="tela-app" style="display: none;">
        
        <header class="header-app">
            <div class="header-top">
                <h1>Loja de Brinquedos</h1>
                <button type="button" id="btn-logout" class="btn-secundario">Sair</button>
            </div>
            
            <!-- NAVEGAÇÃO DE ABAS -->
            <nav class="nav-abas">
                <button type="button" id="btn-aba-criar" class="btn-aba ativa">Criar Nova Lista</button>
                <button type="button" id="btn-aba-gerenciar" class="btn-aba">Buscar / Gerenciar Listas</button>
            </nav>
        </header>

        <main class="conteudo-principal">

            <!-- ABA 1: CRIAR NOVA LISTA -->
            <div id="aba-criar" class="conteudo-aba ativa">
                
                <section class="card-secao">
                    <h2>Dados do Aniversariante</h2>
                    <div class="campo">
                        <label for="nome-aniversariante">Nome da Criança</label>
                        <input type="text" id="nome-aniversariante" placeholder="Ex: João Silva">
                    </div>
                    <div class="campo">
                        <label for="data-festa">Data da Festa</label>
                        <input type="date" id="data-festa">
                    </div>
                </section>

                <section class="card-secao">
                    <h2>Adicionar Produto ao Rascunho</h2>
                    <form id="form-produto">
                        <div class="campo">
                            <label for="foto-produto">Foto do Produto</label>
                            <input type="file" id="foto-produto" accept="image/*" capture="environment">
                        </div>
                        <div class="campo">
                            <label for="nome-produto">Nome do Produto</label>
                            <input type="text" id="nome-produto" placeholder="Ex: Carrinho de Controle" required>
                        </div>
                        <div class="campo">
                            <label for="preco-produto">Preço (R$)</label>
                            <input type="number" id="preco-produto" step="0.01" min="0" placeholder="150.00" required>
                        </div>
                        <button type="submit" class="btn-primario">+ Adicionar Produto</button>
                    </form>
                </section>

                <section class="card-secao">
                    <h2>Produtos na Lista Atual</h2>
                    <ul id="lista-produtos" class="lista-itens"></ul>
                    <button type="button" id="btn-finalizar" class="btn-sucesso">Finalizar e Publicar Lista</button>
                </section>

            </div>

            <!-- ABA 2: BUSCAR / GERENCIAR LISTAS -->
            <div id="aba-gerenciar" class="conteudo-aba">
                <section class="card-secao">
                    <h2>Consultar Listas Ativas</h2>
                    <div class="campo">
                        <input type="text" id="busca-lista" placeholder="Digite o nome do aniversariante...">
                    </div>
                    <div id="container-listas-gerenciar" class="grid-listas">
                        <!-- Cards das listas ativas renderizados via JS -->
                    </div>
                </section>
            </div>

        </main>

    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
